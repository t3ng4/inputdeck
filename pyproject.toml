[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "inputdeck"
dynamic = ["version"]
description = "Hotkeys, macro recording and per-app presets for Linux input devices, with or without input-remapper"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "t3ng4", email = "noreply@users.noreply.github.com"}]
keywords = ["linux", "input", "remapper", "macro", "hotkeys", "evdev", "uinput", "gaming"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment",
    "Topic :: System :: Hardware",
]
dependencies = ["PyQt6>=6.4", "evdev>=1.6"]

[project.urls]
Homepage = "https://github.com/t3ng4/inputdeck"
Issues = "https://github.com/t3ng4/inputdeck/issues"
Changelog = "https://github.com/t3ng4/inputdeck/blob/main/CHANGELOG.md"

[project.scripts]
inputdeck = "inputdeck.__main__:main"

[tool.setuptools]
packages = ["inputdeck"]

[tool.setuptools.package-data]
inputdeck = ["data/icons/*.png"]

[tool.setuptools.dynamic]
version = {attr = "inputdeck.__version__"}
